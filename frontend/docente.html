<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estacionamiento | Docente</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app-shell"><header class="topbar"><a class="brand" href="./docente.html"><span class="brand-mark">P</span><span>Estacionamiento</span></a><div class="topbar-actions"><span id="user-label" class="user-label"></span><button id="logout-button" class="ghost-button">Salir</button></div></header><div class="app-content"><aside class="sidebar"><p class="eyebrow">DOCENTE</p><h1 id="page-title">Mi espacio</h1><nav><button class="nav-button active" data-section="profile">Perfil y vehículos</button><button class="nav-button" data-section="access">Mis accesos</button><button class="nav-button" data-section="complaint">Reportar problema</button></nav></aside><main class="workspace"><p id="page-message" class="form-error" role="alert"></p><section class="teacher-section active" data-panel="profile"><div class="page-heading"><div><p class="eyebrow">MI CUENTA</p><h2 id="vehicle-form-title">Perfil y vehículos</h2></div><button id="cancel-vehicle-edit" class="outline-button hidden" type="button">Cancelar edición</button></div><div id="profile-card" class="panel profile-card"></div><form id="vehicle-form" class="form-grid panel"><input name="id" type="hidden"><label>Placa<input name="placa" placeholder="ABC-123" required></label><label>Marca<input name="marca" placeholder="Toyota" required></label><label>Modelo<input name="modelo" placeholder="Corolla" required></label><label>Color<input name="color" placeholder="Blanco" required></label><button id="vehicle-submit" class="primary-button" type="submit">Registrar vehículo</button><p id="vehicle-message" class="success-message"></p></form><div id="vehicles-list" class="table-list"></div></section><section class="teacher-section" data-panel="access"><div class="page-heading"><div><p class="eyebrow">MOVIMIENTOS</p><h2>Mis accesos</h2></div><button id="refresh-access" class="outline-button">Actualizar</button></div><div id="access-list" class="table-list"></div></section><section class="teacher-section" data-panel="complaint"><div class="page-heading"><div><p class="eyebrow">ATENCION</p><h2>Reportar un problema</h2><p class="muted">El cajón original quedará marcado con la placa intrusa y se te asignará otro libre.</p></div></div><form id="complaint-form" class="panel form-grid"><label>Placa del vehículo intruso<input name="placaOcupante" required placeholder="XYZ-789"></label><label>Descripción<textarea name="descripcion" rows="5" required placeholder="Describe el problema con el cajón asignado"></textarea></label><button class="primary-button" type="submit">Enviar queja y reasignar</button><p id="complaint-message" class="success-message"></p></form></section></main></div></main><script type="module" src="./js/docente.js"></script></body></html>
